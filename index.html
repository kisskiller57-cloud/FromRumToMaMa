<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ချစ်လားမချစ်လားဖြေ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #fff5f7 0%, #ffe4ec 50%, #ffd6e0 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      color: #4a2c3a;
      touch-action: manipulation;
    }

    .bg-shape {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }
    .shape1 { width: 300px; height: 300px; background: #ffb3c6; top: -80px; left: -60px; }
    .shape2 { width: 250px; height: 250px; background: #ffd0dc; bottom: -60px; right: -50px; }
    .shape3 { width: 200px; height: 200px; background: #ffc2d4; top: 40%; right: 10%; }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 30px 60px -20px rgba(200, 80, 120, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      /* No overflow hidden — No button can move freely but stays clamped by JS */
      min-height: 480px;
    }

    .emoji-top {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 1rem;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 3rem;
      font-weight: 700;
      color: #c14a6e;
      /* ✅ စာနှစ်ကြောင်း ခြားဖို့ margin-bottom ကို တင်လိုက်တယ် */
      margin-bottom: 1.4rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      color: #a86278;
      /* ✅ အောက်က button တွေနဲ့လည်း ခြားဖို့ နည်းနည်း တင်လိုက်တယ် */
      margin-bottom: 2.2rem;
      font-weight: 400;
      line-height: 1.6;
    }

    .button-area {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      min-height: 70px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 1rem 2.6rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-yes {
      background: linear-gradient(135deg, #4cd964, #2ea44f);
      color: white;
      box-shadow: 0 12px 26px -10px #2ea44f;
      border: 1px solid #ffffff50;
    }

    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 18px 32px -12px #2ea44f;
    }

    .btn-yes:active {
      transform: scale(0.97);
    }

    /* No button: absolute positioning INSIDE the card */
    .btn-no {
      background: linear-gradient(135deg, #ff6b81, #e63950);
      color: white;
      box-shadow: 0 12px 26px -10px #e63950;
      border: 1px solid #ffffff50;
      position: relative;
      z-index: 5;
    }

    .btn-no.escaped {
      position: absolute;
      z-index: 999;
      margin: 0;
      transition: left 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.2s ease-out;
    }

    /* ===== Surprised face overlay ===== */
    .surprise-face {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.1);
      font-size: 11rem;
      line-height: 1;
      pointer-events: none;
      z-index: 10001;
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.2, 1.8, 0.4, 1),
                  opacity 0.3s ease-out;
      user-select: none;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.35));
    }

    .surprise-face.show {
      transform: translate(-50%, -50%) scale(1.4);
      opacity: 1;
    }

    .surprise-face.fade-out {
      transform: translate(-50%, -50%) scale(1.8);
      opacity: 0;
      transition: transform 0.4s ease-out, opacity 0.4s ease-out;
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 10000;
      transition: opacity 0.15s ease-out;
    }
    .screen-flash.show {
      opacity: 0.7;
    }

    .result {
      margin-top: 2rem;
      font-family: 'Caveat', cursive;
      font-size: 1.9rem;
      color: #2ea44f;
      min-height: 2.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .result.sad {
      color: #e63950;
      font-size: 1.6rem;
    }

    .counter {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #b98a9a;
      font-weight: 400;
      letter-spacing: 0.02em;
      min-height: 1.2rem;
    }

    @media (max-width: 520px) {
      .card {
        padding: 2.2rem 1.5rem;
        border-radius: 2rem;
        min-height: 420px;
      }
      h1 { font-size: 2.3rem; margin-bottom: 1.2rem; }
      .emoji-top { font-size: 2.8rem; }
      .btn { padding: 0.85rem 1.9rem; font-size: 1rem; }
      .button-area { gap: 0.8rem; }
      .surprise-face { font-size: 7rem; }
    }
  </style>
</head>
<body>

  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>
  <div class="screen-flash" id="screenFlash"></div>

  <main class="card" id="card">
    <div class="emoji-top">🥺</div>
    <h1>မောင်မောင်ကို ချစ်လား</h1>
    <p class="subtitle">စိတ်ထဲရှိတဲ့အတိုင်းဖြေနိုင်တယ်😉</p>

    <div class="button-area" id="buttonArea">
      <button class="btn btn-yes" id="yesBtn">Yes 💖</button>
      <button class="btn btn-no" id="noBtn">No 🙅</button>
    </div>

    <div class="result" id="result"></div>
    <div class="counter" id="counter"></div>
  </main>

  <script>
    (function() {
      const card    = document.getElementById('card');
      const yesBtn  = document.getElementById('yesBtn');
      const noBtn   = document.getElementById('noBtn');
      const result  = document.getElementById('result');
      const counterEl = document.getElementById('counter');
      const screenFlash = document.getElementById('screenFlash');

      // ---- configuration ----
      const DANGER_RADIUS = 100;
      const MIN_JUMP_DISTANCE = 140;
      const MAX_JUMP_DISTANCE = 200;
      const MIN_DISTANCE_FROM_CURSOR = 160;
      const MOBILE_TAP_LIMIT = 8;
      const EDGE_PADDING = 14;

      let noClickCount = 0;
      let isEscaped = false;
      let firstClickDone = false;
      let isRunningMode = false;
      let lastMoveTime = 0;
      const MOVE_COOLDOWN = 150;

      const SURPRISE_FACES = ['😳', '😱', '😲', '🤯', '😵', '😧'];

      // -------- Bounds inside the CARD only --------
      function getCardBounds() {
        const cardRect = card.getBoundingClientRect();
        const w = noBtn.offsetWidth  || 140;
        const h = noBtn.offsetHeight || 52;

        const styles = window.getComputedStyle(card);
        const padL = parseFloat(styles.paddingLeft)  || 0;
        const padT = parseFloat(styles.paddingTop)   || 0;
        const padR = parseFloat(styles.paddingRight) || 0;
        const padB = parseFloat(styles.paddingBottom)|| 0;

        const innerLeft = padL + EDGE_PADDING;
        const innerTop  = padT + EDGE_PADDING;
        const innerRight  = cardRect.width  - padR - w - EDGE_PADDING;
        const innerBottom = cardRect.height - padB - h - EDGE_PADDING;

        return {
          minLeft: innerLeft,
          minTop:  innerTop,
          maxLeft: Math.max(innerLeft, innerRight),
          maxTop:  Math.max(innerTop,  innerBottom),
          width: w,
          height: h,
          cardRect,
          padL, padT
        };
      }

      function clamp(v, min, max) {
        if (max < min) return min;
        return Math.min(Math.max(v, min), max);
      }

      function makeEscaped() {
        if (isEscaped) return;
        const cardRect = card.getBoundingClientRect();
        const rect = noBtn.getBoundingClientRect();

        const styles = window.getComputedStyle(card);
        const padL = parseFloat(styles.paddingLeft) || 0;
        const padT = parseFloat(styles.paddingTop)  || 0;

        const relLeft = rect.left - cardRect.left - padL;
        const relTop  = rect.top  - cardRect.top  - padT;

        noBtn.style.width  = rect.width + 'px';
        noBtn.style.height = rect.height + 'px';
        noBtn.classList.add('escaped');

        const b = getCardBounds();
        noBtn.style.left = clamp(relLeft - padL, b.minLeft - padL, b.maxLeft - padL) + 'px';
        noBtn.style.top  = clamp(relTop  - padT, b.minTop  - padT, b.maxTop  - padT) + 'px';

        isEscaped = true;
      }

      function getCurrentLeft() { return parseFloat(noBtn.style.left) || 0; }
      function getCurrentTop()  { return parseFloat(noBtn.style.top)  || 0; }

      function placeAt(left, top) {
        const b = getCardBounds();
        const styles = window.getComputedStyle(card);
        const padL = parseFloat(styles.paddingLeft) || 0;
        const padT = parseFloat(styles.paddingTop)  || 0;

        const safeLeft = clamp(left, b.minLeft - padL, b.maxLeft - padL);
        const safeTop  = clamp(top,  b.minTop  - padT, b.maxTop  - padT);

        noBtn.style.left = safeLeft + 'px';
        noBtn.style.top  = safeTop  + 'px';
      }

      function viewportToCard(x, y) {
        const cardRect = card.getBoundingClientRect();
        const styles = window.getComputedStyle(card);
        const padL = parseFloat(styles.paddingLeft) || 0;
        const padT = parseFloat(styles.paddingTop)  || 0;
        return { x: x - cardRect.left - padL, y: y - cardRect.top - padT };
      }

      // ===== Surprise face =====
      function showSurpriseFace() {
        screenFlash.classList.add('show');
        setTimeout(() => screenFlash.classList.remove('show'), 150);

        const face = document.createElement('div');
        face.className = 'surprise-face';
        face.textContent = SURPRISE_FACES[Math.floor(Math.random() * SURPRISE_FACES.length)];
        document.body.appendChild(face);

        requestAnimationFrame(() => face.classList.add('show'));

        setTimeout(() => {
          face.classList.remove('show');
          face.classList.add('fade-out');
        }, 700);

        setTimeout(() => face.remove(), 1200);
      }

      // ===== Flee =====
      function fleeFrom(viewportX, viewportY) {
        const now = Date.now();
        if (now - lastMoveTime < MOVE_COOLDOWN) return;
        lastMoveTime = now;

        makeEscaped();

        const b = getCardBounds();
        const styles = window.getComputedStyle(card);
        const padL = parseFloat(styles.paddingLeft) || 0;
        const padT = parseFloat(styles.paddingTop)  || 0;

        const curLeft = getCurrentLeft();
        const curTop  = getCurrentTop();

        const cursor = viewportToCard(viewportX, viewportY);

        const candidates = [];
        for (let i = 0; i < 30; i++) {
          const randLeft = b.minLeft - padL + Math.random() * Math.max(0, b.maxLeft - b.minLeft);
          const randTop  = b.minTop  - padT + Math.random() * Math.max(0, b.maxTop  - b.minTop);
          const btnCx = randLeft + b.width  / 2;
          const btnCy = randTop  + b.height / 2;
          const distCursor  = Math.hypot(btnCx - cursor.x, btnCy - cursor.y);
          const distCurrent = Math.hypot(randLeft - curLeft, randTop - curTop);

          if (distCursor >= MIN_DISTANCE_FROM_CURSOR &&
              distCurrent >= MIN_JUMP_DISTANCE * 0.5) {
            candidates.push({
              left: randLeft,
              top: randTop,
              score: distCursor + distCurrent * 0.4
            });
          }
        }

        let targetLeft, targetTop;

        if (candidates.length > 0) {
          candidates.sort((a, bb) => bb.score - a.score);
          targetLeft = candidates[0].left;
          targetTop  = candidates[0].top;
        } else {
          const bcx = curLeft + b.width  / 2;
          const bcy = curTop  + b.height / 2;
          let dx = bcx - cursor.x;
          let dy = bcy - cursor.y;
          let len = Math.hypot(dx, dy) || 1;
          dx /= len;
          dy /= len;

          targetLeft = curLeft + dx * MAX_JUMP_DISTANCE;
          targetTop  = curTop  + dy * MAX_JUMP_DISTANCE;

          const clampL = clamp(targetLeft, b.minLeft - padL, b.maxLeft - padL);
          const clampT = clamp(targetTop,  b.minTop  - padT, b.maxTop  - padT);

          const newCx = clampL + b.width  / 2;
          const newCy = clampT + b.height / 2;
          if (Math.hypot(newCx - cursor.x, newCy - cursor.y) < MIN_DISTANCE_FROM_CURSOR) {
            const corners = [
              { left: b.minLeft - padL, top: b.minTop - padT },
              { left: b.maxLeft - padL, top: b.minTop - padT },
              { left: b.minLeft - padL, top: b.maxTop - padT },
              { left: b.maxLeft - padL, top: b.maxTop - padT }
            ];
            corners.sort((a, c) => {
              const da = Math.hypot((a.left + b.width / 2) - cursor.x, (a.top + b.height / 2) - cursor.y);
              const dc = Math.hypot((c.left + b.width / 2) - cursor.x, (c.top + b.height / 2) - cursor.y);
              return dc - da;
            });
            targetLeft = corners[0].left;
            targetTop  = corners[0].top;
          } else {
            targetLeft = clampL;
            targetTop  = clampT;
          }
        }

        placeAt(targetLeft, targetTop);

        noBtn.style.transform = `rotate(${(Math.random() - 0.5) * 10}deg) scale(1.05)`;
        setTimeout(() => { noBtn.style.transform = 'rotate(0deg) scale(1)'; }, 200);
      }

      function handleMouseMove(e) {
        if (!isRunningMode) return;
        if (noBtn.disabled || noBtn.style.pointerEvents === 'none') return;

        const rect = noBtn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top  + rect.height / 2;
        if (Math.hypot(e.clientX - cx, e.clientY - cy) < DANGER_RADIUS) {
          fleeFrom(e.clientX, e.clientY);
        }
      }

      // ===== No click handler =====
      function handleNoClick(e) {
        if (noBtn.disabled || noBtn.style.pointerEvents === 'none') return;

        let cx = window.innerWidth / 2;
        let cy = window.innerHeight / 2;
        if (e.touches && e.touches[0]) {
          cx = e.touches[0].clientX;
          cy = e.touches[0].clientY;
        } else if (e.clientX || e.clientY) {
          cx = e.clientX;
          cy = e.clientY;
        }

        // ===== FIRST CLICK =====
        if (!firstClickDone) {
          firstClickDone = true;
          noClickCount = 1;

          showSurpriseFace();

          noBtn.style.transform = 'scale(0.85) rotate(-5deg)';
          setTimeout(() => { noBtn.style.transform = 'scale(1.15) rotate(5deg)'; }, 200);
          setTimeout(() => { noBtn.style.transform = 'scale(1) rotate(0deg)'; }, 400);

          counterEl.textContent = '😳 "No" နှိပ်ဖို့မကြိုးစားနဲ့';

          setTimeout(() => {
            isRunningMode = true;
            makeEscaped();
            fleeFrom(cx, cy);
            setTimeout(() => {
              // ✅ ဒီစာကို ပြောင်းလိုက်တယ်
              counterEl.textContent = '😅 "No နှိပ်ရက်တယ်ပေါ့"';
            }, 500);
          }, 700);

          return;
        }

        // ===== SUBSEQUENT CLICKS (No always runs away) =====
noClickCount++;
fleeFrom(cx, cy);
counterEl.textContent = `"No" ဘဲနှိပ်မနေနဲ့လေ`;

        fleeFrom(cx, cy);

        const remaining = MOBILE_TAP_LIMIT - noClickCount;
        if (remaining > 0) {
          counterEl.textContent = `"No" နှိပ်ရက်တယ်ပေါ့!`;
        }
      }

      // ===== YES =====
      yesBtn.addEventListener('click', () => {
        noBtn.style.pointerEvents = 'none';
        noBtn.style.opacity = '0.5';
        result.textContent = 'ချစ်တယ်ဖြေမှာသိသားဘဲ';
        result.classList.remove('sad');
        result.classList.add('show');
        counterEl.textContent = '';
        burstHearts(30);
        yesBtn.innerHTML = '🎉 Forever!';
        yesBtn.disabled = true;
        yesBtn.style.cursor = 'default';
        yesBtn.style.opacity = '0.9';
      });

      // ===== Events =====
      document.addEventListener('mousemove', handleMouseMove, { passive: true });
      noBtn.addEventListener('click', (e) => { e.preventDefault(); handleNoClick(e); });
      noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleNoClick(e); }, { passive: false });

      function reClampNoBtn() {
        if (!isEscaped) return;
        placeAt(getCurrentLeft(), getCurrentTop());
      }
      window.addEventListener('resize', reClampNoBtn);
      window.addEventListener('orientationchange', () => setTimeout(reClampNoBtn, 250));

      function burstHearts(count) {
        const hearts = ['❤️', '💖', '💕', '💗', '🌸', '✨', '💘'];
        for (let i = 0; i < count; i++) {
          const heart = document.createElement('span');
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.position = 'fixed';
          heart.style.left = (window.innerWidth / 2) + 'px';
          heart.style.top = (window.innerHeight / 2) + 'px';
          heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
          heart.style.pointerEvents = 'none';
          heart.style.zIndex = '9999';
          heart.style.transition = 'transform 1.2s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 1.2s ease-out';
          heart.style.opacity = '1';
          document.body.appendChild(heart);
          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 300 + 120;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;
          requestAnimationFrame(() => {
            heart.style.transform = `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg) scale(1.6)`;
            heart.style.opacity = '0';
          });
          setTimeout(() => heart.remove(), 1400);
        }
      }
    })();
  </script>
</body>
</html>
